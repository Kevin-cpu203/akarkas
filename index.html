<script>
    // --- DATABASE (Disimpan secara permanen di memori HP) ---
    // Mengambil data dari Local Storage, jika kosong maka gunakan []
    let transaksi = JSON.parse(localStorage.getItem('data_akarkas')) || [];

    // Fungsi baru untuk menyimpan perubahan ke HP
    function simpanKeLokal() {
        localStorage.setItem('data_akarkas', JSON.stringify(transaksi));
    }

    let jenisAktif = 'pengeluaran';
    let filterSaatIni = 'semua';
    let bChart, aChart;
    
    // --- LIST KATEGORI DINAMIS ---
    const katPemasukan = ['Penjualan Melon', 'Lainnya'];
    const katPengeluaran = ['Bibit & Benih', 'Pupuk', 'Pestisida & Obat', 'Tenaga Kerja', 'Listrik & Air', 'Peralatan & Greenhouse', 'Lainnya'];

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    
    const formatDateRead = (dateStr) => {
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        return new Date(dateStr).toLocaleDateString('id-ID', options);
    };

    const setTodayDate = () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('input-tanggal').value = `${yyyy}-${mm}-${dd}`;
    };

    // --- LOGIKA KATEGORI ---
    function renderKategori(jenis) {
        const container = document.getElementById('kategori-container');
        container.innerHTML = '';
        const daftarKategori = jenis === 'pemasukan' ? katPemasukan : katPengeluaran;
        const defaultKat = jenis === 'pemasukan' ? 'Penjualan Melon' : 'Pupuk'; 

        daftarKategori.forEach((kat) => {
            const isAktif = kat === defaultKat ? 'active' : '';
            container.innerHTML += `<span class="pill ${isAktif}" onclick="selectPill(this)">${kat}</span>`;
        });
        
        document.getElementById('input-kategori').value = defaultKat;
        document.getElementById('input-kategori-lainnya').style.display = 'none';
        document.getElementById('input-kategori-lainnya').value = '';
    }

    function selectPill(el) {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        
        const catName = el.innerText;
        document.getElementById('input-kategori').value = catName;
        
        if (catName.toLowerCase() === 'lainnya') {
            document.getElementById('input-kategori-lainnya').style.display = 'block';
            document.getElementById('input-kategori-lainnya').focus();
        } else {
            document.getElementById('input-kategori-lainnya').style.display = 'none';
        }
    }

    // --- LOGIKA SPA ---
    function switchTab(tabId, navElement = null) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        if(navElement) navElement.classList.add('active');
        else {
            const navs = document.querySelectorAll('.nav-item');
            if(tabId === 'view-catat') navs[1].classList.add('active');
            if(tabId === 'view-beranda') navs[0].classList.add('active');
        }

        if(tabId === 'view-beranda') renderBeranda();
        if(tabId === 'view-catat') { setTodayDate(); } 
        if(tabId === 'view-riwayat') renderRiwayat();
        if(tabId === 'view-analisis') renderAnalisis();
    }

    // --- FUNGSI HALAMAN BERANDA ---
    function renderBeranda() {
        let inTotal = 0, outTotal = 0;
        transaksi.forEach(t => { if(t.jenis === 'pemasukan') inTotal += t.nominal; else outTotal += t.nominal; });
        
        const saldoTotal = inTotal - outTotal;
        document.getElementById('b-saldo').innerText = formatRp(saldoTotal);
        document.getElementById('b-in').innerText = formatRp(inTotal);
        document.getElementById('b-out').innerText = formatRp(outTotal);
        document.getElementById('chart-center-saldo').innerText = formatRp(saldoTotal);

        let dataGrafik = [inTotal, outTotal];
        let warnaGrafik = ['#2b7a5c', '#e67e22'];
        if(inTotal === 0 && outTotal === 0) {
            dataGrafik = [1];
            warnaGrafik = ['#e0e0e0'];
        }

        const ctx = document.getElementById('berandaChart').getContext('2d');
        if(bChart) bChart.destroy();
        bChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: (inTotal === 0 && outTotal === 0) ? ['Belum ada data'] : ['Pemasukan', 'Pengeluaran'],
                datasets: [{ data: dataGrafik, backgroundColor: warnaGrafik, borderWidth: 0, hoverOffset: 4 }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '78%', plugins: { legend: { display: false }, tooltip: { enabled: (inTotal !== 0 || outTotal !== 0) } } }
        });
    }

    // --- FUNGSI HALAMAN CATAT ---
    function setJenis(jenis) {
        jenisAktif = jenis;
        const bIn = document.getElementById('btn-in'); const bOut = document.getElementById('btn-out');
        bIn.className = 'toggle-btn'; bOut.className = 'toggle-btn';
        
        renderKategori(jenis);

        if (jenis === 'pemasukan') {
            bIn.classList.add('active-in');
            document.getElementById('group-berat').style.display = 'block';
            document.getElementById('input-catatan').placeholder = 'Contoh: panen minggu ke-3';
        } else {
            bOut.classList.add('active-out');
            document.getElementById('group-berat').style.display = 'none';
            document.getElementById('input-catatan').placeholder = 'Contoh: Perbaikan Alas Greenhouse';
        }
    }

    function simpanManual() {
        const nominal = parseInt(document.getElementById('input-nominal').value);
        if(!nominal) return alert('Jumlah uang (Rp) belum diisi!');
        
        let kategoriFinal = document.getElementById('input-kategori').value;
        if(kategoriFinal.toLowerCase() === 'lainnya') {
            const katLain = document.getElementById('input-kategori-lainnya').value.trim();
            if(!katLain) return alert('Silakan tulis rincian kategori lainnya pada kotak isian!');
            kategoriFinal = katLain; 
        }

        transaksi.push({
            id: Date.now(),
            jenis: jenisAktif,
            kategori: kategoriFinal,
            nominal: nominal,
            berat: parseInt(document.getElementById('input-berat').value) || 0,
            tanggal: document.getElementById('input-tanggal').value,
            catatan: document.getElementById('input-catatan').value
        });
        
        // Simpan ke memori HP
        simpanKeLokal();
        
        document.getElementById('input-nominal').value = '';
        document.getElementById('input-berat').value = '';
        document.getElementById('input-catatan').value = '';
        setTodayDate();
        setJenis('pengeluaran'); 
        
        alert('Data Berhasil Disimpan!');
        switchTab('view-beranda'); 
    }

    // --- FUNGSI HALAMAN RIWAYAT & FILTER ---
    function filterRiwayat(jenis) {
        filterSaatIni = jenis;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        
        if(jenis === 'semua') document.getElementById('filter-semua').classList.add('active');
        if(jenis === 'pemasukan') document.getElementById('filter-in').classList.add('active');
        if(jenis === 'pengeluaran') document.getElementById('filter-out').classList.add('active');
        
        renderRiwayat();
    }

    function renderRiwayat() {
        const list = document.getElementById('riwayat-list');
        list.innerHTML = '';
        
        let dataDitampilkan = [...transaksi].reverse();
        if(filterSaatIni !== 'semua') {
            dataDitampilkan = dataDitampilkan.filter(t => t.jenis === filterSaatIni);
        }

        if(dataDitampilkan.length === 0) {
            list.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px;">
                <i class="fa-solid fa-folder-open" style="font-size:40px; margin-bottom:10px; opacity:0.3;"></i>
                <p>Belum ada data transaksi.</p>
            </div>`;
            return;
        }

        dataDitampilkan.forEach(t => {
            const isMasuk = t.jenis === 'pemasukan';
            list.innerHTML += `
                <div class="tx-item">
                    <div class="tx-icon ${isMasuk ? 'i-in' : 'i-out'}"><i class="fa-solid ${isMasuk ? 'fa-arrow-down' : 'fa-arrow-up'}"></i></div>
                    <div class="tx-details">
                        <h4>${t.kategori}</h4>
                        <p>${formatDateRead(t.tanggal)} ${t.berat > 0 ? '| 🍈 '+t.berat+'Kg' : ''}</p>
                        ${t.catatan ? `<p style="font-style:italic; color:#999; margin-top:2px;">"${t.catatan}"</p>` : ''}
                    </div>
                    <div class="tx-amount">
                        <h4 style="color: ${isMasuk ? 'var(--primary-dark)' : 'var(--expense-text)'}">${isMasuk ? '+' : '-'}${formatRp(t.nominal)}</h4>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="bukaEdit(${t.id})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-del" onclick="hapusTx(${t.id})" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // --- FUNGSI EDIT MODAL ---
    function bukaEdit(id) {
        const tx = transaksi.find(t => t.id === id);
        if(!tx) return;
        document.getElementById('edit-id').value = tx.id;
        document.getElementById('edit-kategori').value = tx.kategori;
        document.getElementById('edit-nominal').value = tx.nominal;
        document.getElementById('edit-berat').value = tx.berat || '';
        document.getElementById('edit-tanggal').value = tx.tanggal;
        document.getElementById('edit-catatan').value = tx.catatan || '';
        document.getElementById('modal-edit').style.display = 'flex';
    }

    function tutupEdit() { document.getElementById('modal-edit').style.display = 'none'; }

    function simpanEdit() {
        const id = parseInt(document.getElementById('edit-id').value);
        const index = transaksi.findIndex(t => t.id === id);
        
        if(index !== -1) {
            const nominalBaru = parseInt(document.getElementById('edit-nominal').value);
            if(!nominalBaru) return alert("Nominal tidak boleh kosong!");

            transaksi[index].kategori = document.getElementById('edit-kategori').value;
            transaksi[index].nominal = nominalBaru;
            transaksi[index].berat = parseInt(document.getElementById('edit-berat').value) || 0;
            transaksi[index].tanggal = document.getElementById('edit-tanggal').value;
            transaksi[index].catatan = document.getElementById('edit-catatan').value;

            // Simpan pembaruan ke memori HP
            simpanKeLokal();

            tutupEdit();
            renderRiwayat();
            alert("Perubahan berhasil disimpan!");
        }
    }

    function hapusTx(id) {
        if(confirm('Yakin ingin menghapus transaksi ini?')) {
            transaksi = transaksi.filter(t => t.id !== id);
            
            // Simpan penghapusan ke memori HP
            simpanKeLokal();
            
            renderRiwayat();
        }
    }

    // --- FUNGSI HALAMAN ANALISIS ---
    function renderAnalisis() {
        const badge = document.getElementById('status-badge');
        const teks = document.getElementById('teks-analisis');
        const ctx = document.getElementById('analisisChart').getContext('2d');
        
        if(aChart) aChart.destroy();

        if(transaksi.length === 0) {
            badge.className = 'status-badge status-surplus'; badge.innerText = 'BELUM ADA DATA';
            teks.innerHTML = `<strong>Mulai Pencatatan!</strong><br><br>Belum ada data transaksi keuangan untuk dianalisis bulan ini. Silakan catat pemasukan atau pengeluaran pertama Anda melalui menu Catat.`;
            aChart = new Chart(ctx, { type: 'bar', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false } });
            return;
        }

        let inTotal = 0, outTotal = 0;
        let outCategories = {};

        transaksi.forEach(t => {
            if(t.jenis === 'pemasukan') inTotal += t.nominal;
            else {
                outTotal += t.nominal;
                outCategories[t.kategori] = (outCategories[t.kategori] || 0) + t.nominal;
            }
        });

        const saldo = inTotal - outTotal;
        let maxCat = '-', maxVal = 0;
        for(let cat in outCategories) {
            if(outCategories[cat] > maxVal) { maxVal = outCategories[cat]; maxCat = cat; }
        }

        if(saldo >= 0) {
            badge.className = 'status-badge status-surplus'; badge.innerText = 'SURPLUS';
            teks.innerHTML = `<strong>Kinerja Bagus!</strong> Keuangan sedang Surplus sebesar <b>${formatRp(saldo)}</b>.<br><br>Pemasukan utama berhasil menutupi operasional. ${maxCat !== '-' ? `Fokuskan pemantauan pada <b>${maxCat}</b> karena ini menyedot dana terbesar bulan ini sebesar ${formatRp(maxVal)}.` : ''}`;
        } else {
            badge.className = 'status-badge status-minus'; badge.innerText = 'MINUS / DEFISIT';
            teks.innerHTML = `<strong>Perhatian:</strong> Arus kas minus <b>${formatRp(Math.abs(saldo))}</b>.<br><br>Ini wajar jika sedang dalam fase tanam dan belum panen. Kebocoran terbesar ada di pos <b>${maxCat}</b> (${formatRp(maxVal)}). Coba efisiensikan biaya di sektor tersebut.`;
        }

        aChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: Object.keys(outCategories), datasets: [{ label: 'Total Rp', data: Object.values(outCategories), backgroundColor: '#e67e22', borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    // --- FUNGSI GENERATE PDF (FITUR BARU) ---
    function unduhLaporanPDF(btnElement) {
        if (transaksi.length === 0) {
            alert("Belum ada data transaksi yang bisa dicetak ke PDF!");
            return;
        }

        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
        btnElement.disabled = true;

        let inTotal = 0, outTotal = 0;
        let tbodyHTML = '';
        
        let dataCetak = [...transaksi].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

        dataCetak.forEach(t => {
            if(t.jenis === 'pemasukan') inTotal += t.nominal;
            else outTotal += t.nominal;
            
            const isMasuk = t.jenis === 'pemasukan';
            tbodyHTML += `
                <tr>
                    <td style="padding: 10px; border: 1px solid #d1d9ce; text-align: center;">${formatDateRead(t.tanggal)}</td>
                    <td style="padding: 10px; border: 1px solid #d1d9ce; font-weight: bold;">
                        ${t.kategori}
                        ${t.berat > 0 ? `<br><span style="font-weight: normal; font-size: 11px; color: #6b726a;">Volume: ${t.berat} kg</span>` : ''}
                    </td>
                    <td style="padding: 10px; border: 1px solid #d1d9ce; text-align: center; color: ${isMasuk ? '#2b7a5c' : '#c0392b'}; font-weight: bold;">
                        ${isMasuk ? 'Pemasukan' : 'Pengeluaran'}
                    </td>
                    <td style="padding: 10px; border: 1px solid #d1d9ce; text-align: right;">${formatRp(t.nominal)}</td>
                    <td style="padding: 10px; border: 1px solid #d1d9ce; font-size: 11px;">${t.catatan || '-'}</td>
                </tr>
            `;
        });
        
        const saldoTotal = inTotal - outTotal;

        const pdfContainer = document.createElement('div');
        pdfContainer.innerHTML = `
            <div style="padding: 30px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1f291e;">
                <div style="text-align: center; border-bottom: 2px solid #2b7a5c; padding-bottom: 20px; margin-bottom: 30px;">
                    <h1 style="margin: 0 0 5px 0; color: #2b7a5c; font-size: 26px; text-transform: uppercase; letter-spacing: 1px;">Laporan Keuangan AkarKas</h1>
                    <p style="margin: 0; color: #6b726a; font-size: 14px;">Buku Kas Digital - Pencatatan Keuangan Greenhouse</p>
                    <p style="margin: 8px 0 0 0; color: #1f291e; font-size: 12px; font-weight: bold;">Dicetak pada: ${formatDateRead(new Date().toISOString())}</p>
                </div>
                
                <div style="display: flex; justify-content: space-between; gap: 15px; margin-bottom: 30px;">
                    <div style="flex: 1; background-color: #f5f8f4; padding: 20px; border-radius: 8px; border: 1px solid #c4d1c4; text-align: center;">
                        <p style="margin: 0 0 8px 0; font-size: 12px; font-weight: bold; color: #385d34; text-transform: uppercase;">Total Saldo Netto</p>
                        <h2 style="margin: 0; font-size: 20px; color: #1f291e;">${formatRp(saldoTotal)}</h2>
                    </div>
                    <div style="flex: 1; background-color: #e4f0d9; padding: 20px; border-radius: 8px; border: 1px solid #c4d1c4; text-align: center;">
                        <p style="margin: 0 0 8px 0; font-size: 12px; font-weight: bold; color: #2b7a5c; text-transform: uppercase;">Total Pemasukan</p>
                        <h2 style="margin: 0; font-size: 20px; color: #2b7a5c;">${formatRp(inTotal)}</h2>
                    </div>
                    <div style="flex: 1; background-color: #faeaea; padding: 20px; border-radius: 8px; border: 1px solid #e8a0a0; text-align: center;">
                        <p style="margin: 0 0 8px 0; font-size: 12px; font-weight: bold; color: #c0392b; text-transform: uppercase;">Total Pengeluaran</p>
                        <h2 style="margin: 0; font-size: 20px; color: #c0392b;">${formatRp(outTotal)}</h2>
                    </div>
                </div>

                <h3 style="font-size: 16px; margin: 0 0 15px 0; color: #385d34; border-left: 4px solid #2b7a5c; padding-left: 10px;">Rincian Riwayat Transaksi</h3>
                <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    <thead>
                        <tr style="background-color: #2b7a5c; color: white;">
                            <th style="padding: 12px; border: 1px solid #2b7a5c; text-align: center; width: 15%;">Tanggal</th>
                            <th style="padding: 12px; border: 1px solid #2b7a5c; text-align: left; width: 25%;">Kategori / Rincian</th>
                            <th style="padding: 12px; border: 1px solid #2b7a5c; text-align: center; width: 15%;">Jenis</th>
                            <th style="padding: 12px; border: 1px solid #2b7a5c; text-align: right; width: 20%;">Nominal</th>
                            <th style="padding: 12px; border: 1px solid #2b7a5c; text-align: left; width: 25%;">Catatan Tambahan</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tbodyHTML}
                    </tbody>
                </table>
                
                <div style="margin-top: 40px; text-align: center; color: #6b726a; font-size: 11px;">
                    <p>Dokumen ini di-generate secara otomatis oleh sistem Aplikasi AkarKas.</p>
                </div>
            </div>
        `;

        const options = {
            margin:       [5, 5, 5, 5],
            filename:     'Laporan_Keuangan_AkarKas.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(options).from(pdfContainer).save().then(() => {
            btnElement.innerHTML = originalText;
            btnElement.disabled = false;
        });
    }

    // --- FUNGSI VOICE ---
    function startVoiceBot() {
        if (!('webkitSpeechRecognition' in window)) return alert('Gunakan browser Chrome untuk fitur suara.');
        const rec = new webkitSpeechRecognition();
        rec.lang = 'id-ID';
        rec.onstart = () => console.log('Mendengarkan...');
        rec.onresult = (e) => {
            const hasil = e.results[0][0].transcript.toLowerCase();
            if(hasil.includes('jual') || hasil.includes('panen')) setJenis('pemasukan');
            else setJenis('pengeluaran');
            
            const angkaArr = hasil.match(/\d+/g);
            if(angkaArr) {
                let pengali = hasil.includes('juta') ? 1000000 : (hasil.includes('ribu') ? 1000 : 1);
                document.getElementById('input-nominal').value = parseInt(angkaArr[0]) * pengali;
                
                if(angkaArr.length > 1) {
                    const no2 = parseInt(angkaArr[1]);
                    document.getElementById('input-berat').value = no2 < parseInt(angkaArr[0]) ? no2 : '';
                }
            }
            document.getElementById('input-catatan').value = hasil;
            alert(`Sistem menangkap: "${hasil}".\nCek form manual untuk mengkonfirmasi penyimpanan.`);
        };
        rec.start();
    }

    // Inisialisasi awal
    window.onload = () => { 
        renderBeranda(); 
        setTodayDate();
        setJenis('pengeluaran'); 
    };

    // Mendaftarkan Service Worker PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker berhasil didaftarkan!', reg.scope))
                .catch(err => console.error('Service Worker gagal didaftarkan', err));
        });
    }
</script>
